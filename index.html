<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Stay Organized</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Todo List Website</h1>
        <nav>
            <a href="#home">Home</a>
        </nav>
    </header>
    <main>
        <section id="home">
            <div class="container">
                <h2>My Todo List</h2>
                <p>Keep track of your tasks and stay productive!</p>
                <div class="todo-input">
                    <input type="text" id="todo-input" placeholder="Add a new todo...">
                    <button id="add-btn">Add</button>
                </div>
                <div class="todo-controls">
                    <button id="delete-all-btn">Delete All</button>
                </div>
                <ul id="todo-list"></ul>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Todo List Website. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
